version: 2
updates:
  - package-ecosystem: "cargo"
    directories:
      - "/clippaste/daemon"
      - "/nautilus-copy-path"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
